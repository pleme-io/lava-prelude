[package]
authors = ["pleme-io"]
description = "Single-import facade over the lava typed surface. use lava_prelude::*; pulls Architecture / Resource / Type / Interface / Synthesizer / EmbeddedRuntime / NetworkResult / LavaRuntime / TerraformJsonRuntime + every layer. Pattern: std::prelude. Reduces 9-crate dependency wall to one import."
edition = "2024"
license = "MIT"
name = "lava-prelude"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-prelude"
version = "0.1.0"

[lib]
name = "lava_prelude"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
lava-core      = { git = "https://github.com/pleme-io/lava-core",      branch = "main" }
lava-arch      = { git = "https://github.com/pleme-io/lava-arch",      branch = "main" }
lava-contracts = { git = "https://github.com/pleme-io/lava-contracts", branch = "main" }
lava-stack     = { git = "https://github.com/pleme-io/lava-stack",     branch = "main" }
lava-types     = { git = "https://github.com/pleme-io/lava-types",     branch = "main" }
lava-schema    = { git = "https://github.com/pleme-io/lava-schema",    branch = "main" }
lava-eval      = { git = "https://github.com/pleme-io/lava-eval",      branch = "main" }
lava-runtime   = { git = "https://github.com/pleme-io/lava-runtime",   branch = "main" }

[dev-dependencies]
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"
