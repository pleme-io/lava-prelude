[package]
authors = ["pleme-io"]
description = "Single-import facade over the lava typed surface. use lava_prelude::*; pulls Architecture / Resource / Type / Interface / Synthesizer / EmbeddedRuntime / NetworkResult / LavaRuntime / TerraformJsonRuntime + every layer. Pattern: std::prelude. Reduces 9-crate dependency wall to one import."
edition = "2024"
license = "MIT"
name = "lava-prelude"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-prelude"
version = "0.1.8"

[lib]
name = "lava_prelude"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
lava-core      = "0.1"
lava-arch      = "0.1"
lava-contracts = "0.1"
lava-stack     = "0.1"
lava-types     = "0.1"
lava-schema    = "0.1"
lava-eval      = "0.1"
lava-runtime   = "0.1"
lava-architectures = "0.1"

[dev-dependencies]
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"
